<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দোকান হিসাব</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f4f1;--c:#fff;--t:#17212b;--m:#667180;--a:#2447d6;--at:#fff;--w:#c2410c;--ok:#15803d;--b:#dfe2dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--c:#1a212a;--t:#eef1f4;--m:#9aa5b3;--a:#7c9bff;--at:#10151b;--w:#fb923c;--ok:#4ade80;--b:#2a333e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--c:#1a212a;--t:#eef1f4;--m:#9aa5b3;--a:#7c9bff;--at:#10151b;--w:#fb923c;--ok:#4ade80;--b:#2a333e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif;padding-bottom:76px}
main{padding:16px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 12px;font-weight:700}
h2{font-size:17px;margin:20px 0 8px;font-weight:600}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--m);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{width:100%;margin-top:14px;padding:13px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--a);color:var(--at)}
.sm{width:auto;margin:0;padding:7px 12px;font-size:14px}
.ghost{background:transparent;color:var(--a);border:1px solid var(--b)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--b)}
.item:first-child{border-top:0}
.m{color:var(--m);font-size:14px}.low{color:var(--w);font-weight:600}.big{font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{color:var(--ok);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding:12px 10px;white-space:nowrap;border:0;background:none;font:inherit;font-size:14px;color:var(--m);font-weight:500}
nav button.on{color:var(--a);font-weight:700;box-shadow:inset 0 3px 0 var(--a)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-weight:600;color:var(--m);text-align:right;padding:6px 3px;border-bottom:1px solid var(--b)}td{padding:9px 3px;text-align:right;border-top:1px solid var(--b);vertical-align:top}th:first-child,td:first-child{text-align:left}tfoot td{font-weight:700}table.gt{border:1px solid var(--m);background:var(--c)}table.gt th,table.gt td{border:1px solid var(--m);padding:9px 6px}table.gt th{background:var(--bg);text-align:center}.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}.hd h1{margin:0}.dt{text-align:right;line-height:1.3}.dt b{display:block;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{padding:6px 12px;font:inherit;font-size:14px;border:1px solid var(--b);border-radius:99px;background:var(--bg);color:var(--t)}
.empty{color:var(--m);text-align:center;padding:18px 0}
</style>
</head>
<body>
<main id="v"></main>
<nav>
<button data-t="s" onclick="go('s')">বিক্রি</button>
<button data-t="p" onclick="go('p')">স্টক</button>
<button data-t="d" onclick="go('d')">বাকি</button>
<button data-t="x" onclick="go('x')">খরচ</button>
<button data-t="m" onclick="go('m')">মহাজন</button>
<button data-t="k" onclick="go('k')">ফোনবুক</button>
<button data-t="r" onclick="go('r')">হিসাব</button>
</nav>
<script>
var D;try{D=JSON.parse(localStorage.getItem('dokan'))}catch(e){}
D=D||{p:[],s:[],e:[],y:[]};D.m=D.m||[];D.k=D.k||[];
function save(){try{localStorage.setItem('dokan',JSON.stringify(D))}catch(e){}}
var $=function(s){return document.querySelector(s)};
var N=function(n){return Number(n).toLocaleString('bn-BD')};
var F=function(n){return '৳'+N(Math.round(n))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var tab='s',LOW=3;
function go(t){tab=t;render()}
function render(keep){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  $('#v').innerHTML={s:vSale,p:vStock,d:vDue,x:vExp,m:vMah,k:vBook,r:vRep}[tab]();
  var on=document.querySelector('nav button.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
  if(!keep)window.scrollTo(0,0);
}
function sameDay(t){return new Date(t).toDateString()===new Date().toDateString()}
function sameMonth(t){var a=new Date(t),b=new Date();return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()}

/* বিক্রি */
function vSale(){
  var opts=D.p.filter(function(p){return p.q>0}).map(function(p){return '<option value="'+p.id+'">'+esc(p.n)+' ('+N(p.q)+' টি)</option>'}).join('');
  var today=D.s.filter(function(x){return sameDay(x.t)}).reverse();
  var tot=today.reduce(function(a,x){return a+x.q*x.pr},0);
  var form=D.p.length?
   '<div class="card"><label>পণ্য</label><select id="sp" onchange="fillPrice()">'+opts+'</select>'+
   '<div class="row"><div><label>সংখ্যা</label><input id="sq" type="number" inputmode="numeric" min="1" value="1"></div>'+
   '<div><label>দাম (প্রতি পিস)</label><input id="spr" type="number" inputmode="decimal"></div></div>'+
   '<label>কত টাকা পেলেন? (ফাঁকা রাখলে পুরো টাকা)</label><input id="spd" type="number" inputmode="decimal">'+
   '<label>কাস্টমারের নাম (বাকি হলে আবশ্যক)</label><input id="sc" type="text">'+
   '<button class="btn" onclick="sell()">বিক্রি সংরক্ষণ করুন</button></div>':
   '<div class="card empty">আগে স্টক ট্যাবে পণ্য যোগ করুন।</div>';
  var gp=today.reduce(function(a,x){return a+x.q*(x.pr-x.co)},0),cost=today.reduce(function(a,x){return a+x.q*x.co},0);
  var list=today.length?'<table class="gt"><thead><tr><th>পণ্যের নাম</th><th>ক্রয় মূল্য</th><th>বিক্রি মূল্য</th><th>প্রফিট</th></tr></thead><tbody>'+today.map(function(x){var pf=x.q*(x.pr-x.co);return '<tr><td>'+esc(x.n)+' × '+N(x.q)+'<div class="m">'+(x.c?esc(x.c)+' · ':'')+(x.paid<x.q*x.pr?'বাকি '+F(x.q*x.pr-x.paid):'নগদ')+'</div></td><td>'+F(x.q*x.co)+'</td><td>'+F(x.q*x.pr)+'</td><td class="'+(pf>=0?'g':'low')+'">'+F(pf)+'</td></tr>'}).join('')+'</tbody><tfoot><tr><td>মোট</td><td>'+F(cost)+'</td><td>'+F(tot)+'</td><td class="'+(gp>=0?'g':'low')+'">'+F(gp)+'</td></tr></tfoot></table>':'<div class="empty">আজ এখনো বিক্রি হয়নি।</div>';
  setTimeout(fillPrice,0);
  var dn=new Date();
  return '<div class="hd"><h1>আজকের বিক্রি</h1><div class="dt"><b>'+dn.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})+'</b><span class="m">'+dn.toLocaleDateString('bn-BD',{weekday:'long'})+'</span></div></div>'+list+'<h2>নতুন বিক্রি যোগ করুন</h2>'+form;
}
function fillPrice(){var p=D.p.find(function(x){return x.id==($('#sp')||{}).value});if(p&&$('#spr'))$('#spr').value=p.s}
function sell(){
  var p=D.p.find(function(x){return x.id==$('#sp').value}),q=+$('#sq').value,pr=+$('#spr').value;
  if(!p||!(q>=1)||!(pr>=0))return alert('পণ্য, সংখ্যা ও দাম ঠিকভাবে দিন।');
  if(q>p.q)return alert('স্টকে মাত্র '+N(p.q)+' টি আছে।');
  var tot=q*pr,paid=$('#spd').value===''?tot:+$('#spd').value,c=$('#sc').value.trim();
  if(paid<tot&&!c)return alert('বাকি থাকলে কাস্টমারের নাম দিন।');
  p.q-=q;D.s.push({t:Date.now(),n:p.n,q:q,pr:pr,co:p.b,paid:Math.min(paid,tot),c:c});
  save();render();
}

/* স্টক */
function vStock(){
  var list=D.p.length?D.p.map(function(p){return '<div class="item"><div><b>'+esc(p.n)+'</b><div class="m">'+(p.c?esc(p.c)+' · ':'')+'কেনা '+F(p.b)+' · বিক্রি '+F(p.s)+'</div></div>'+
   '<div style="text-align:right"><div class="'+(p.q<=LOW?'low':'')+'">'+N(p.q)+' টি'+(p.q<=LOW?' (কম)':'')+'</div>'+
   '<button class="btn sm ghost" onclick="addQty('+p.id+')">+ স্টক</button> <button class="btn sm ghost" onclick="delP('+p.id+')">মুছুন</button></div></div>'}).join(''):'<div class="empty">কোনো পণ্য নেই। নিচের ফর্মে যোগ করুন।</div>';
  return '<h1>স্টক</h1><div class="card">'+list+'</div><h2>নতুন পণ্য</h2><div class="card">'+
   '<label>পণ্যের নাম</label><input id="pn" type="text" placeholder="যেমন: প্লাস্টিক চেয়ার, সাদা">'+
   '<label>ক্যাটাগরি</label><input id="pc" type="text" placeholder="যেমন: চেয়ার, বাসনপত্র">'+
   '<div class="row"><div><label>কেনা দাম</label><input id="pb" type="number" inputmode="decimal"></div><div><label>বিক্রির দাম</label><input id="ps" type="number" inputmode="decimal"></div></div>'+
   '<label>স্টকে কতগুলো আছে</label><input id="pq" type="number" inputmode="numeric">'+
   '<button class="btn" onclick="addP()">পণ্য যোগ করুন</button></div>';
}
function addP(){
  var n=$('#pn').value.trim(),b=+$('#pb').value,s=+$('#ps').value,q=+$('#pq').value;
  if(!n||!(s>0)||!(q>=0))return alert('নাম, বিক্রির দাম ও সংখ্যা দিন।');
  D.p.push({id:Date.now(),n:n,c:$('#pc').value.trim(),b:b||0,s:s,q:q});save();render();
}
function addQty(id){var v=prompt('কতগুলো স্টকে যোগ হবে?');v=+v;if(!(v>0))return;D.p.find(function(p){return p.id===id}).q+=v;save();render()}
function delP(id){if(confirm('এই পণ্য মুছে ফেলবেন?')){D.p=D.p.filter(function(p){return p.id!==id});save();render()}}

/* বাকি */
function dues(){
  var m={};
  D.s.forEach(function(x){if(x.c){m[x.c]=(m[x.c]||0)+x.q*x.pr-x.paid}});
  D.y.forEach(function(y){m[y.c]=(m[y.c]||0)-y.a});
  return Object.keys(m).filter(function(k){return m[k]>0}).map(function(k){return [k,m[k]]}).sort(function(a,b){return b[1]-a[1]});
}
function vDue(){
  var d=dues(),tot=d.reduce(function(a,x){return a+x[1]},0);
  var list=d.length?d.map(function(x){return '<div class="item"><div><b>'+esc(x[0])+'</b></div><div style="text-align:right"><div class="low">'+F(x[1])+'</div><button class="btn sm ghost" onclick="pay(\''+encodeURIComponent(x[0])+'\')">টাকা জমা নিন</button></div></div>'}).join(''):'<div class="empty">কারো কাছে বাকি নেই।</div>';
  return '<h1>বাকির খাতা</h1><div class="card"><div class="m">মোট পাবেন</div><div class="big">'+F(tot)+'</div></div><div class="card">'+list+'</div>';
}
function pay(c){
  c=decodeURIComponent(c);var v=+prompt(c+' কত টাকা দিলেন?');
  if(!(v>0))return;D.y.push({t:Date.now(),c:c,a:v});save();render();
}

/* মহাজন */
var openM=null;
function mBal(m){return m.l.reduce(function(a,x){return a+(x.k==='b'?x.a:-x.a)},0)}
function vMah(){
  var tot=D.m.reduce(function(a,m){return a+Math.max(mBal(m),0)},0);
  var list=D.m.length?D.m.slice().sort(function(a,b){return mBal(b)-mBal(a)}).map(function(m){
    var b=mBal(m),h='';
    if(openM===m.id){h='<div class="m" style="margin-top:8px">'+(m.ph?esc(m.ph)+'<br>':'')+(m.l.slice().reverse().slice(0,10).map(function(x){return new Date(x.t).toLocaleDateString('bn-BD')+' · '+(x.k==='b'?'মাল নিলাম ':'টাকা দিলাম ')+F(x.a)}).join('<br>')||'কোনো লেনদেন নেই')+'</div><button class="btn sm ghost" style="margin-top:8px" onclick="delM('+m.id+')">মহাজন মুছুন</button>'}
    return '<div class="item" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px" onclick="togM('+m.id+')"><b>'+esc(m.n)+'</b><b class="'+(b>0?'low':'g')+'">'+(b>0?'দেবেন '+F(b):b<0?'বেশি দিয়েছেন '+F(-b):'বাকি নেই')+'</b></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="mTx('+m.id+',1)">মাল নিলাম (বাকি)</button><button class="btn sm ghost" onclick="mTx('+m.id+',0)">টাকা দিলাম</button></div>'+h+'</div>'}).join(''):'<div class="empty">কোনো মহাজন যোগ করা হয়নি।</div>';
  return '<h1>মহাজন ও পাওনাদার</h1><div class="card"><div class="m">মোট দিতে হবে</div><div class="big">'+F(tot)+'</div></div><div class="card">'+list+'</div>'+
   '<h2>নতুন মহাজন / কোম্পানি</h2><div class="card"><label>নাম</label><input id="mn" type="text" placeholder="যেমন: রহিম প্লাস্টিক, আল-আমিন ট্রেডার্স">'+
   '<label>ফোন নম্বর (ঐচ্ছিক)</label><input id="mp" type="tel" inputmode="tel">'+
   '<label>এখন পর্যন্ত কত টাকা বাকি আছে? (ঐচ্ছিক)</label><input id="ma" type="number" inputmode="decimal">'+
   '<button class="btn" onclick="addM()">মহাজন যোগ করুন</button></div>';
}
function togM(id){openM=openM===id?null:id;render(1)}
function mTx(id,buy){
  var m=D.m.find(function(x){return x.id===id}),v=+prompt(m.n+(buy?': কত টাকার মাল নিলেন (বাকি)?':': কত টাকা দিলেন?'));
  if(!(v>0))return;m.l.push({t:Date.now(),k:buy?'b':'p',a:v});save();render(1);
}
function addM(){
  var n=$('#mn').value.trim(),a=+$('#ma').value;
  if(!n)return alert('মহাজনের নাম দিন।');
  var m={id:Date.now(),n:n,ph:$('#mp').value.trim(),l:[]};
  if(a>0)m.l.push({t:Date.now(),k:'b',a:a});
  D.m.push(m);save();render();
}
function delM(id){if(confirm('এই মহাজন ও তার সব হিসাব মুছে ফেলবেন?')){D.m=D.m.filter(function(x){return x.id!==id});openM=null;save();render()}}

/* ব্যাকআপ */
var rs=false;
function backupBox(){
  return '<h2>ব্যাকআপ ও ফিরিয়ে আনা</h2><div class="card"><div class="m">'+(D.lb?'শেষ ব্যাকআপ: '+new Date(D.lb).toLocaleDateString('bn-BD'):'এখনো ব্যাকআপ নেওয়া হয়নি')+'</div>'+
   '<button class="btn" onclick="doBackup()">ব্যাকআপ নিন</button>'+
   '<label>ব্যাকআপের লেখা (ব্যাকআপ নিলে এখানে আসবে; ফিরিয়ে আনতে এখানে পেস্ট করুন)</label><textarea id="bk" rows="5" oninput="rs=false" style="width:100%;font:13px monospace;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)"></textarea>'+
   '<button class="btn ghost" onclick="doRestore()">এই ব্যাকআপ থেকে ফিরিয়ে আনুন</button>'+
   '<div id="bm" class="m" style="margin-top:8px"></div></div>';
}
function doBackup(){
  rs=false;D.lb=Date.now();save();
  var t=JSON.stringify(D),a=$('#bk'),ok=false;
  a.value=t;a.focus();a.select();
  try{ok=document.execCommand('copy')}catch(e){}
  if(!ok){try{navigator.clipboard.writeText(t).catch(function(){})}catch(e){}}
  $('#bm').textContent=ok?'লেখাটি কপি হয়েছে। এখন নোট অ্যাপ বা হোয়াটসঅ্যাপে নিজেকে পাঠিয়ে সংরক্ষণ করুন।':'ওপরের লেখাটি সব কপি করে নোট অ্যাপ বা হোয়াটসঅ্যাপে নিজেকে পাঠিয়ে রাখুন। অটো কপি না হলে লেখার ওপর চেপে ধরে সব সিলেক্ট করে কপি করুন।';
}
function doRestore(){
  var m=$('#bm'),o;
  try{o=JSON.parse($('#bk').value.trim())}catch(e){rs=false;m.textContent='ব্যাকআপের লেখাটি ঠিক নেই। পুরো লেখাটি আবার পেস্ট করুন।';return}
  if(!o||!Array.isArray(o.p)||!Array.isArray(o.s)||!Array.isArray(o.e)||!Array.isArray(o.y)){rs=false;m.textContent='এটা এই এপের ব্যাকআপ নয়।';return}
  if(!rs){rs=true;m.textContent='সতর্কতা: বর্তমান সব তথ্য মুছে ব্যাকআপের তথ্য বসবে। নিশ্চিত হলে একই বাটন আবার চাপুন।';return}
  rs=false;o.m=Array.isArray(o.m)?o.m:[];o.k=Array.isArray(o.k)?o.k:[];
  D=o;save();render(1);$('#bm').textContent='তথ্য ফিরিয়ে আনা হয়েছে।';
}

/* ফোনবুক */
function bookList(q){
  q=(q||'').trim().toLowerCase();
  var r=D.k.filter(function(x){return !q||(x.n+' '+x.ph+' '+x.t).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a.n.localeCompare(b.n,'bn')});
  return r.length?r.map(function(x){return '<div class="item"><div><b>'+esc(x.n)+'</b>'+(x.t?'<div class="m">'+esc(x.t)+'</div>':'')+'</div><div style="text-align:right"><a href="tel:'+esc(x.ph.replace(/[^0-9+]/g,''))+'" style="color:var(--a);font-weight:600;text-decoration:none">'+esc(x.ph)+'</a><div><button class="btn sm ghost" onclick="delK('+x.id+')">মুছুন</button></div></div></div>'}).join(''):'<div class="empty">কোনো নাম পাওয়া যায়নি।</div>';
}
function vBook(){
  return '<h1>ফোনবুক</h1><div class="card"><label>খুঁজুন</label><input id="bq" type="search" placeholder="নাম বা নম্বর" oninput="searchK(this.value)"><div id="bl" style="margin-top:8px">'+bookList('')+'</div></div>'+
   '<h2>নতুন নম্বর সেভ করুন</h2><div class="card"><label>নাম</label><input id="kn" type="text">'+
   '<label>ফোন নম্বর</label><input id="kp" type="tel" inputmode="tel">'+
   '<label>পরিচয় (ঐচ্ছিক)</label><input id="kt" type="text" placeholder="যেমন: কাস্টমার, মহাজন, ভ্যানচালক">'+
   '<button class="btn" onclick="addK()">সেভ করুন</button></div>';
}
function searchK(v){$('#bl').innerHTML=bookList(v)}
function addK(){var n=$('#kn').value.trim(),p=$('#kp').value.trim();if(!n||!p)return alert('নাম ও ফোন নম্বর দিন।');D.k.push({id:Date.now(),n:n,ph:p,t:$('#kt').value.trim()});save();render()}
function delK(id){if(confirm('এই নম্বর মুছে ফেলবেন?')){D.k=D.k.filter(function(x){return x.id!==id});save();render(1)}}

/* হিসাব */
function vRep(){
  function sum(f){var s=D.s.filter(function(x){return f(x.t)});var e=D.e.filter(function(x){return f(x.t)});
    var sale=s.reduce(function(a,x){return a+x.q*x.pr},0),gp=s.reduce(function(a,x){return a+x.q*(x.pr-x.co)},0),ex=e.reduce(function(a,x){return a+x.a},0);
    return {sale:sale,gp:gp,ex:ex,net:gp-ex}}
  var d=sum(sameDay),m=sum(sameMonth);
  function box(t,r){return '<div class="card"><div class="m">'+t+'</div><div class="big">'+F(r.sale)+'</div><div class="m">খরচ '+F(r.ex)+'</div><div class="'+(r.net>=0?'g':'low')+'">লাভ '+F(r.net)+'</div></div>'}
  return '<h1>হিসাব</h1><div class="grid">'+box('আজ',d)+box('এই মাস',m)+'</div><div class="m">লাভ = বিক্রি − কেনা দাম − খরচ</div>'+backupBox();
}

/* খরচ */
function vExp(){
  var today=D.e.filter(function(x){return sameDay(x.t)}).reverse();
  var tot=today.reduce(function(a,x){return a+x.a},0);
  var seen={};D.e.forEach(function(x){seen[x.n]=(seen[x.n]||0)+1});
  var names=Object.keys(seen).sort(function(a,b){return seen[b]-seen[a]}).slice(0,6);
  var chips=names.length?'<div class="chips">'+names.map(function(n){return '<button class="chip" onclick="pick(\''+encodeURIComponent(n)+'\')">'+esc(n)+'</button>'}).join('')+'</div>':'';
  var list=today.length?today.map(function(x){return '<div class="item"><div>'+esc(x.n)+(x.note?'<div class="m">'+esc(x.note)+'</div>':'')+'</div><div style="text-align:right"><b>'+F(x.a)+'</b> <button class="btn sm ghost" onclick="delE('+x.t+')">মুছুন</button></div></div>'}).join(''):'<div class="empty">আজ এখনো কোনো খরচ লেখা হয়নি।</div>';
  return '<h1>আজকের খরচ</h1><div class="card"><div class="m">আজ মোট খরচ</div><div class="big">'+F(tot)+'</div></div>'+
   '<div class="card"><label>কিসের খরচ (নিজে লিখুন)</label><input id="en" type="text" placeholder="যেমন: চা-নাস্তা, ভ্যান ভাড়া, বিদ্যুৎ">'+chips+
   '<label>টাকা</label><input id="ea" type="number" inputmode="decimal">'+
   '<label>নোট (ঐচ্ছিক)</label><input id="eo" type="text">'+
   '<button class="btn" onclick="addE()">খরচ সংরক্ষণ করুন</button></div>'+
   '<h2>আজকের খরচের তালিকা</h2><div class="card">'+list+'</div>';
}
function pick(n){$('#en').value=decodeURIComponent(n);$('#ea').focus()}
function addE(){var n=$('#en').value.trim(),a=+$('#ea').value;if(!n||!(a>0))return alert('খরচের নাম ও টাকা দিন।');D.e.push({t:Date.now(),n:n,a:a,note:$('#eo').value.trim()});save();render()}
function delE(t){if(confirm('এই খরচ মুছে ফেলবেন?')){D.e=D.e.filter(function(x){return x.t!==t});save();render()}}
render();
</script>
</body>
</html>
